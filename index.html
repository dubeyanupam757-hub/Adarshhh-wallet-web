<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adarsh Wallet - Home</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <header class="header">
    <div class="logo">B²</div>
    <div class="brand">BOTS <span>By Adarsh</span></div>
    <div class="sub">SECURE WALLET</div>
  </header>

  <main class="main" id="mainContent">
    <div class="page-header">
      <h1>My Account</h1>
      <p>Your personal wallet dashboard</p>
    </div>

    <section class="card wallet-card">
      <h2>My Wallet</h2>
      <div class="balance-row">
        <span class="bal-label">Available Balance</span>
        <span class="bal-amount" id="balAmt">₹0.00</span>
      </div>
      <button class="btn-refresh" onclick="loadBalance()">↻ Refresh</button>
    </section>

    <section class="card info-card">
      <div class="holder-row">
        <span>→</span><span class="holder-text">Bot Holder</span><span>→</span>
      </div>
      <p class="bot-name">👑 Adarsh Wallet 👑</p>
      <div class="user-info">
        <div><b>Name:</b> <span id="userName">User</span></div>
        <div><b>User ID:</b> <code id="userId">000000</code></div>
      </div>
    </section>

    <section class="section transactions-section">
      <div class="section-header">
        <h2>📄 Transactions</h2>
        <button class="btn-view-all" onclick="openViewAll()">View All</button>
      </div>
      <div class="tx-list" id="txList"></div>
    </section>
  </main>

  <nav class="nav-bar">
    <a class="nav-item active" href="index.html"><span class="nav-icon">🏠</span><span>Home</span></a>
    <a class="nav-item" href="pay.html"><span class="nav-icon">👤</span><span>Pay User</span></a>
    <a class="nav-item" href="withdraw.html"><span class="nav-icon">💸</span><span>Withdraw</span></a>
    <a class="nav-item" href="bonus.html"><span class="nav-icon">🎁</span><span>Bonus</span></a>
  </nav>
</div>

<!-- Transaction Detail Modal -->
<div class="modal-overlay" id="txModal">
  <div class="modal">
    <button class="modal-close" onclick="closeTxModal()">✕</button>
    <div id="txModalContent"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="index.js"></script>
</body>
 </html>
