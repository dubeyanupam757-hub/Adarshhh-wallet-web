<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pay User - Adarsh Wallet</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0f172a 100%);
    color: #fff;
    min-height: 100vh;
    padding-bottom: 80px;
  }
  .header { padding: 16px; text-align: center; }
  .logo { width: 32px; height: 32px; background: #22d3ee; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-weight: bold; color: #0f172a; font-size: 14px; margin-right: 8px; }
  .brand { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; vertical-align: middle; }
  .brand span { color: #fbbf24; }
  .sub { font-size: 11px; color: #94a3b8; letter-spacing: 1px; margin-top: 4px; display: block; }
  .page-title { font-size: 22px; font-weight: 700; margin: 20px 16px 6px 16px; color: #fff; }
  .page-sub { font-size: 13px; color: #94a3b8; margin: 0 16px 18px 16px; }

  .card {
    background: rgba(30, 41, 59, 0.6);
    backdrop-filter: blur(12px);
    border-radius: 16px;
    padding: 20px 16px;
    margin: 0 16px 20px 16px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .bal-label { font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
  .bal-amount { font-size: 26px; font-weight: 700; color: #fbbf24; margin-bottom: 16px; }

  .input-group { margin-bottom: 16px; }
  .field-label { font-size: 12px; color: #94a3b8; margin-bottom: 8px; display: block; }
  .input {
    width: 100%;
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    color: #fff;
    padding: 14px 16px;
    font-size: 16px;
    outline: none;
  }
  .input::placeholder { color: #64748b; }

  .pay-btn {
    width: 100%;
    height: 52px;
    background: linear-gradient(135deg, #3b82f6 0%, #d97706 100%);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(59,130,246,0.4);
  }
  .pay-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .nav-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(12px);
    border-top: 1px solid rgba(255,255,255,0.08);
    padding: 10px 0;
    display: flex; justify-content: space-around;
    z-index: 100;
  }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: #64748b; text-decoration: none; }
  .nav-item.active { color: #22d3ee; }
  .nav-icon { font-size: 22px; }

  .hint { font-size: 11px; color: #64748b; text-align: center; margin: 10px 16px 0 16px; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">B²</div>
  <span class="brand">BOTS <span style="color:#fbbf24">By Adarsh</span></span>
  <div class="sub">SECURE WALLET</div>
</div>

<div class="page-title">Pay Users</div>
<div class="page-sub">Transfer wallet balance to another user</div>

<div class="card">
  <div class="bal-label">Available Balance</div>
  <div class="bal-amount" id="balAmt">₹0.00</div>

  <div class="input-group">
    <label class="field-label">User ID or Username</label>
    <input type="text" class="input" id="userInput" placeholder="Enter User ID or @username">
  </div>

  <div class="input-group">
    <label class="field-label">Amount (₹)</label>
    <input type="number" class="input" id="amtInput" placeholder="0" step="0.01" min="0">
  </div>

  <button class="pay-btn" id="payBtn" onclick="doPay()">PAY NOW</button>
</div>

<nav class="nav-bar">
  <a class="nav-item" href="index.html">
    <div class="nav-icon">🏠</div>
    <div>Home</div>
  </a>
  <a class="nav-item active" href="pay.html">
    <div class="nav-icon">👤</div>
    <div>Pay User</div>
  </a>
  <a class="nav-item" href="withdraw.html">
    <div class="nav-icon">💸</div>
    <div>Withdraw</div>
  </a>
  <a class="nav-item" href="bonus.html">
    <div class="nav-icon">🎁</div>
    <div>Bonus</div>
  </a>
</nav>

<div class="hint">Powered by Adarsh Wallet • Secure & Instant</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  document.getElementById('balAmt').textContent = '₹0.00';

  function doPay() {
    const target = document.getElementById('userInput').value.trim();
    const amount = parseFloat(document.getElementById('amtInput').value);
    if (!target) { alert('Please enter User ID or Username'); return; }
    if (!amount || amount <= 0) { alert('Enter valid amount'); return; }
    alert('Payment request submitted!\nTo: ' + target + '\nAmount: ₹' + amount.toFixed(2));
    document.getElementById('userInput').value = '';
    document.getElementById('amtInput').value = '';
  }
</script>

</body>
</html>
