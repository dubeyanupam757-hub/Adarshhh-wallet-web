<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pay User - Adarsh Wallet</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <header class="header">
    <div class="logo">B²</div>
    <div class="brand">BOTS <span>By Adarsh</span></div>
    <div class="sub">SECURE WALLET</div>
  </header>

  <main class="main">
    <div class="page-header">
      <h1>Pay Users</h1>
      <p>Transfer wallet balance to another user</p>
    </div>

    <section class="card">
      <div class="balance-row">
        <span class="bal-label">Available Balance</span>
        <span class="bal-amount" id="balAmt">₹0.00</span>
      </div>

      <div class="form-group">
        <label>User ID or Username</label>
        <input type="text" class="input" id="userInput" placeholder="Enter User ID or @username" autocomplete="off">
      </div>

      <div class="form-group">
        <label>Amount (₹)</label>
        <input type="number" class="input" id="amtInput" placeholder="0" step="0.01" min="0" inputmode="decimal">
      </div>

      <button class="btn-primary" id="payBtn" onclick="doPay()">PAY NOW</button>
      <p id="payMsg" class="msg"></p>
    </section>
  </main>

  <nav class="nav-bar">
    <a class="nav-item" href="index.html"><span class="nav-icon">🏠</span><span>Home</span></a>
    <a class="nav-item active" href="pay.html"><span class="nav-icon">👤</span><span>Pay User</span></a>
    <a class="nav-item" href="withdraw.html"><span class="nav-icon">💸</span><span>Withdraw</span></a>
    <a class="nav-item" href="bonus.html"><span class="nav-icon">🎁</span><span>Bonus</span></a>
  </nav>
</div>

<script src="config.js"></script>
<script src="api.js"></script>
<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
let uid = API.getUserId();
document.getElementById("userName").textContent = API.getUserName();

async function loadBal() {
  const res = await API.getBalance(uid);
  if (res.ok) document.getElementById("balAmt").textContent = "₹" + res.balance.toFixed(2);
}
loadBal();

async function doPay() {
  const to = document.getElementById("userInput").value.trim();
  const amt = parseFloat(document.getElementById("amtInput").value);
  const msgEl = document.getElementById("payMsg");
  const btn = document.getElementById("payBtn");
  
  if (!to) { msgEl.textContent = "Enter user ID/username"; msgEl.className = "msg error"; return; }
  if (!amt || amt <= 0) { msgEl.textContent = "Enter valid amount"; msgEl.className = "msg error"; return; }
  
  btn.disabled = true; btn.textContent = "Processing...";
  msgEl.textContent = ""; msgEl.className = "msg";
  
  try {
    const res = await API.doAction("pay", { to, amount: amt });
    if (res.ok) {
      msgEl.textContent = res.message; msgEl.className = "msg success";
      document.getElementById("balAmt").textContent = "₹" + res.new_balance.toFixed(2);
      document.getElementById("userInput").value = "";
      document.getElementById("amtInput").value = "";
    } else {
      msgEl.textContent = res.error; msgEl.className = "msg error";
    }
  } catch (e) {
    msgEl.textContent = "Network error"; msgEl.className = "msg error";
  }
  btn.disabled = false; btn.textContent = "PAY NOW";
}
</script>
</body>
</html>
