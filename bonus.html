<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bonus - Adarsh Wallet</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <header class="header">
    <div class="logo">B²</div>
    <div class="brand">BOTS <span>By Adarsh</span></div>
    <div class="sub">SECURE WALLET</div>
  </header>

  <main class="main">
    <div class="page-header">
      <h1>Rewards</h1>
      <p>Gift codes and claim history</p>
    </div>

    <section class="card">
      <h2>Gift Code</h2>
      <p class="card-desc">Enter a valid gift code to redeem reward</p>
      
      <div class="form-group">
        <input type="text" class="input" id="codeInput" placeholder="Enter code" autocomplete="off" style="text-transform:uppercase;">
      </div>
      <button class="btn-primary" onclick="redeemCode()">Redeem</button>
      <p id="giftMsg" class="msg"></p>
    </section>

    <section class="card history-card">
      <div class="section-header">
        <h2>🎁 Gift Code History</h2>
      </div>
      <div class="history-list" id="giftHistory"></div>
    </section>
  </main>

  <nav class="nav-bar">
    <a class="nav-item" href="index.html"><span class="nav-icon">🏠</span><span>Home</span></a>
    <a class="nav-item" href="pay.html"><span class="nav-icon">👤</span><span>Pay User</span></a>
    <a class="nav-item" href="withdraw.html"><span class="nav-icon">💸</span><span>Withdraw</span></a>
    <a class="nav-item active" href="bonus.html"><span class="nav-icon">🎁</span><span>Bonus</span></a>
  </nav>
</div>

<script src="config.js"></script>
<script src="api.js"></script>
<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
let uid = API.getUserId();

async function loadHistory() {
  try {
    const res = await API.getGiftHistory(uid);
    if (res.ok) renderHistory(res.history);
  } catch (e) { console.error(e); }
}

function renderHistory(hist) {
  const el = document.getElementById("giftHistory");
  if (hist.length === 0) { el.innerHTML = '<p class="empty">No gift codes claimed yet</p>'; return; }
  el.innerHTML = hist.map(h => `
    <div class="history-item">
      <div class="hist-info">
        <div class="hist-code">${escapeHtml(h.code)}</div>
        <div class="hist-date">${escapeHtml(h.date)}</div>
      </div>
      <div class="hist-amount ${h.status === 'success' ? 'pos' : 'neg'}">
        ${h.status === 'success' ? '+' : ''}₹${Math.abs(h.amount).toFixed(2)}
      </div>
      <div class="hist-status">${escapeHtml(h.status)}</div>
    </div>
  `).join("");
}

function escapeHtml(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

async function redeemCode() {
  const code = document.getElementById("codeInput").value.trim().toUpperCase();
  const msg = document.getElementById("giftMsg");
  const btn = document.querySelector("#bonus .btn-primary");
  
  if (!code) { msg.textContent = "Enter a code"; msg.className = "msg error"; return; }
  
  btn.disabled = true; btn.textContent = "Redeeming...";
  msg.textContent = ""; msg.className = "msg";
  
  try {
    const res = await API.doAction("gift", { code });
    if (res.ok) {
      msg.textContent = res.message; msg.className = "msg success";
      document.getElementById("codeInput").value = "";
      await loadHistory();
      // Update balance on home if needed
    } else {
      msg.textContent = res.error; msg.className = "msg error";
    }
  } catch (e) {
    msg.textContent = "Network error"; msg.className = "msg error";
  }
  btn.disabled = false; btn.textContent = "Redeem";
}

loadHistory();
</script>
</body>
      </html>
